name: release draft

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  update:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Update release draft
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
