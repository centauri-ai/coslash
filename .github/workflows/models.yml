name: Models

# Refreshes collector/internal/session/models.json from LiteLLM and opens a PR when the table changed
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  refresh:
    name: Refresh model table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: collector/go.mod
          # This module has no dependencies or go.sum to cache.
          cache: false
      - name: Refresh the model table
        run: make -C collector models
      - name: Look for a change
        id: change
        run: |
          if git diff --quiet -- collector/internal/session/models.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The model table is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- collector/internal/session/models.json
          fi
      # A pull request that GITHUB_TOKEN opens does not start CI, so the test
      # that guards the table runs here instead.
      - name: Test collector
        if: steps.change.outputs.changed == 'true'
        run: make -C collector test
      - name: Push the refresh branch
        if: steps.change.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B models-refresh
          git add collector/internal/session/models.json
          git commit -m 'Refresh the model table from LiteLLM'
          git push --force origin models-refresh
      - name: Open a pull request
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$(gh pr list --head models-refresh --state open --json number --jq '.[].number')" ]]; then
            echo "The open pull request now carries the newest table."
            exit 0
          fi
          gh pr create --head models-refresh --base main \
            --title 'Refresh the model table from LiteLLM' \
            --body 'Generated by `make models`. Read every price change before you merge: this table sets the cost figures in the UI.'
