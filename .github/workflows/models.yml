name: Models

# Refreshes collector/internal/session/models.json from LiteLLM and opens a PR when the table changed
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  refresh:
    name: Refresh model table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record the models in the current table
        run: jq -r 'keys[]' collector/internal/session/models.json | sort > /tmp/models-before.txt
      - name: Refresh the model table
        run: make -C collector models
      - name: Compare the model lists
        id: compare
        run: |
          jq -r 'keys[]' collector/internal/session/models.json | sort > /tmp/models-after.txt
          {
            echo 'added<<MODELS'
            comm -13 /tmp/models-before.txt /tmp/models-after.txt
            echo 'MODELS'
            echo 'dropped<<MODELS'
            comm -23 /tmp/models-before.txt /tmp/models-after.txt
            echo 'MODELS'
          } >> "$GITHUB_OUTPUT"
          if git diff --quiet -- collector/internal/session/models.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The model table is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- collector/internal/session/models.json
          fi
      - name: Push the refresh branch
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B models-refresh
          git add collector/internal/session/models.json
          git commit -m 'Refresh the model table from LiteLLM'
          git push --force origin models-refresh
      - name: Open a pull request
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Model names come from LiteLLM, so they reach the shell as data only.
          ADDED: ${{ steps.compare.outputs.added }}
          DROPPED: ${{ steps.compare.outputs.dropped }}
        run: |
          {
            echo 'Generated by `make models`. Read every price change before you merge:'
            echo 'this table sets the cost figures and context gauges in the UI.'
            echo
            echo '### Models dropped'
            echo '```'
            echo "${DROPPED:-none}"
            echo '```'
            echo '### Models added'
            echo '```'
            echo "${ADDED:-none}"
            echo '```'
          } > /tmp/pr-body.md
          if [[ $(wc -c < /tmp/pr-body.md) -gt 60000 ]]; then
            {
              echo 'Generated by `make models`. Read every price change before you merge:'
              echo 'this table sets the cost figures and context gauges in the UI.'
              echo
              echo 'The model list is too large for the pull request description.'
              echo 'Read the complete list in the pull request diff.'
            } > /tmp/pr-body.md
          fi
          test "$(wc -c < /tmp/pr-body.md)" -le 60000
          if [[ -n "$(gh pr list --head models-refresh --state open --json number --jq '.[].number')" ]]; then
            echo "The open pull request now carries the newest table."
            gh pr edit models-refresh --body-file /tmp/pr-body.md
            exit 0
          fi
          gh pr create --head models-refresh --base main \
            --title 'Refresh the model table from LiteLLM' \
            --body-file /tmp/pr-body.md
      # A dropped model shows $0.00 and no context gauge, so the run ends red
      # even though the pull request is open and ready to read.
      - name: Fail on a dropped model
        if: steps.compare.outputs.dropped != ''
        env:
          DROPPED: ${{ steps.compare.outputs.dropped }}
        run: |
          echo "::error::LiteLLM no longer carries: $(echo "$DROPPED" | paste -sd' ' -)"
          exit 1
