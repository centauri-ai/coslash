version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        # Comment and naming style, off as in the staticcheck default.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # CLI and API errors are sentences that users read.
        - -ST1005
        # Refactoring hints, not defects.
        - -QF*
