<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>coSlash — Mission Control</title>
<style>
/* coSlash prototype — shared tokens and chrome.
   Tokens mirror frontend/src/index.css so these prototypes sit in the real design system. */

:root {
  --brand: #3554d1;
  --success: #2f9e63; --success-fg: #2f7d55; --success-bg: #e4f2ea;
  --info: #6366f1;    --info-fg: #4f46b5;    --info-bg: #ecebfb;
  --warning: #c08a2e; --warning-fg: #8a6316; --warning-bg: #f7efdd;
  --claude: #a24218;  --claude-bg: #f6e7de;
  --codex: #4f5eea;   --codex-bg: #e8eaff;
  --subagent: #0b7c91; --subagent-bg: #dff4f7;

  --background: #fff;
  --foreground: #252525;
  --muted: #f7f7f7;
  --muted-foreground: #8e8e8e;
  --border: #ebebeb;
  --radius: 10px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: 'Geist Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--background); color: var(--foreground); font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
mark { background: #fde68a; color: inherit; border-radius: 2px; padding: 0 1px; }
code { font: 400 .92em/1 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--muted); border-radius: 4px; padding: 1px 4px; }

/* ---------- concept switcher (prototype navigation only) ---------- */
.proto-bar {
  display: flex; align-items: center; gap: 10px; padding: 6px 16px;
  background: #f4f5f7; border-bottom: 1px solid var(--border);
  font-size: 11.5px; color: var(--muted-foreground);
}
.proto-bar .note { display: inline-flex; align-items: center; gap: 6px; }
.proto-bar .dot { width: 5px; height: 5px; border-radius: 999px; background: #c3c6cc; }
.proto-links { margin-left: auto; display: flex; gap: 4px; }
.proto-links a {
  color: var(--muted-foreground); text-decoration: none; font-weight: 500;
  padding: 4px 9px; border-radius: 6px;
}
.proto-links a:hover { background: #e9eaee; color: var(--foreground); }
.proto-links a[aria-current="page"] { background: #fff; color: var(--brand); font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,.1); }

/* ---------- app header ---------- */
.app-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.logo { display: flex; align-items: center; gap: 8px; }
.logo-mark { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(140deg, #6f86f0, #3554d1 60%, #0b7c91); flex: none; }
.logo-name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.logo-name span { color: var(--brand); }
.head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.btn {
  border: 1px solid var(--border); background: #fff; border-radius: 8px;
  padding: 6px 11px; font-size: 12.5px; font-weight: 500; cursor: pointer;
}
.btn:hover { background: var(--muted); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.btn-primary:hover { background: #2c48bb; }
.btn-primary:disabled { background: #c7cee8; border-color: #c7cee8; cursor: not-allowed; }

/* ---------- search + filters ---------- */
.search-wrap { position: relative; flex: 1; min-width: 200px; }
.search-wrap input {
  width: 100%; height: 36px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--muted); padding: 0 74px 0 34px; font: inherit; font-size: 13.5px; color: var(--foreground);
}
.search-wrap input:focus { outline: none; background: #fff; border-color: #c3ccea; box-shadow: 0 0 0 3px rgba(53,84,209,.10); }
.search-wrap input::placeholder { color: var(--muted-foreground); }
.search-wrap > svg { position: absolute; left: 11px; top: 10px; color: var(--muted-foreground); pointer-events: none; }
.search-keys { position: absolute; right: 8px; top: 8px; display: flex; gap: 3px; }
.kbd {
  font: 600 10px/1 ui-monospace, Menlo, monospace; color: var(--muted-foreground);
  background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 4px 5px;
}
.clear-btn {
  position: absolute; right: 8px; top: 7px; border: 0; background: transparent;
  color: var(--muted-foreground); cursor: pointer; padding: 3px 5px; border-radius: 5px; font-size: 15px; line-height: 1;
}
.clear-btn:hover { background: #e9eaee; color: var(--foreground); }

.segbar { display: inline-flex; background: var(--muted); border-radius: 8px; padding: 2px; flex: none; }
.segbar button {
  border: 0; background: transparent; font-size: 12px; font-weight: 500;
  color: var(--muted-foreground); padding: 5px 10px; border-radius: 6px; cursor: pointer;
}
.segbar button:hover { color: var(--foreground); }
.segbar button[aria-selected="true"] { background: #fff; color: var(--foreground); font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,.08); }

.scope {
  display: flex; align-items: center; gap: 8px; padding: 8px 16px;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  background: #fbfbfc; font-size: 12px; color: var(--muted-foreground);
}
.scope b { color: var(--foreground); font-weight: 600; }
.scope .link { color: var(--brand); font-weight: 600; background: none; border: 0; cursor: pointer; padding: 0; font-size: 12px; }

/* ---------- agent + status vocabulary ----------
   Agent is a readable label, never colour alone. */
.agent-tag {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  font-size: 11px; font-weight: 600; border-radius: 6px; padding: 3px 7px; white-space: nowrap;
}
.agent-claude { color: var(--claude); background: var(--claude-bg); }
.agent-codex  { color: var(--codex);  background: var(--codex-bg); }
.agent-swatch { width: 6px; height: 6px; border-radius: 2px; }
.agent-claude .agent-swatch { background: var(--claude); }
.agent-codex  .agent-swatch { background: var(--codex); }

.state { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; white-space: nowrap; flex: none; }
.state-active  { color: var(--success-fg); }
.state-waiting { color: var(--warning-fg); }
.state-idle    { color: var(--info-fg); }
.state-off     { color: #b0b3b9; font-weight: 500; }
.state-unknown { color: var(--muted-foreground); font-weight: 500; }
.pip { width: 6px; height: 6px; border-radius: 999px; flex: none; }
.pip-active { background: var(--success); }
.pip-idle { background: var(--info); }
.pip-off { background: #cbced3; }
.pip-unknown { border: 1.5px dashed #b6b9bf; }
.pip-waiting { background: var(--warning); }
@media (prefers-reduced-motion: no-preference) {
  .pip-active { box-shadow: 0 0 0 0 rgba(47,158,99,.55); animation: pulse 2.2s infinite; }
}
@media (prefers-reduced-motion: reduce) { .pip-active { box-shadow: 0 0 0 3px rgba(47,158,99,.2); } }
@keyframes pulse { 70% { box-shadow: 0 0 0 5px rgba(47,158,99,0); } 100% { box-shadow: 0 0 0 0 rgba(47,158,99,0); } }

.chip-mono {
  font: 500 11px/1 ui-monospace, Menlo, monospace; background: var(--muted); color: #62666e;
  border-radius: 5px; padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px;
}
.chip-remote {
  font: 500 10.5px/1 ui-monospace, Menlo, monospace; color: #62666e; background: var(--muted);
  border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; white-space: nowrap;
}
.chip-subs {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
  color: var(--subagent); background: var(--subagent-bg); border-radius: 5px; padding: 3px 7px; white-space: nowrap;
}
.why {
  display: inline-flex; font: 600 9.5px/1 ui-monospace, Menlo, monospace; letter-spacing: .04em;
  text-transform: uppercase; color: #6b7078; background: var(--muted); border: 1px solid var(--border);
  border-radius: 4px; padding: 3px 5px; margin-right: 6px; flex: none;
}
.tag-illustrative {
  font: 600 9.5px/1 ui-monospace, Menlo, monospace; letter-spacing: .04em; text-transform: uppercase;
  color: var(--warning-fg); background: var(--warning-bg); border-radius: 4px; padding: 3px 5px; white-space: nowrap;
}

/* ---------- empty states ---------- */
.empty-note {
  border: 1px dashed #dcdfe4; border-radius: 9px; background: #fcfcfd;
  padding: 12px 15px; display: flex; align-items: center; gap: 9px;
  font-size: 12.5px; color: #7d818a;
}
.empty-note b { color: #4a4e56; font-weight: 600; }

/* ---------- inspector drawer ---------- */
.scrim {
  position: fixed; inset: 0; background: rgba(23,39,66,.28); z-index: 40;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 94vw); z-index: 50;
  background: #fff; border-left: 1px solid var(--border); display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.7,.3,1);
  box-shadow: -12px 0 40px -20px rgba(16,24,40,.4);
}
.drawer.open { transform: translateX(0); }
@media (prefers-reduced-motion: reduce) {
  .drawer, .scrim { transition: none; }
}
.drawer-head { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.drawer-title-row { display: flex; align-items: center; gap: 8px; }
.drawer-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; flex: 1; min-width: 0; }
.drawer-close { border: 0; background: transparent; cursor: pointer; color: var(--muted-foreground); font-size: 18px; padding: 2px 7px; border-radius: 6px; }
.drawer-close:hover { background: var(--muted); color: var(--foreground); }
.drawer-sub { display: flex; align-items: center; gap: 7px; padding-top: 9px; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
.drawer-foot { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 10px; background: #fbfbfc; }
.drawer-foot .hint { font-size: 11.5px; color: var(--muted-foreground); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.stat-cell { background: #fff; padding: 9px 11px; }
.stat-k { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-foreground); }
.stat-v { font-size: 14px; font-weight: 650; padding-top: 3px; font-variant-numeric: tabular-nums; }

.sec-k { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-foreground); padding: 18px 0 7px; }
.prose { font-size: 13px; line-height: 1.55; color: #3f434b; }
.prose-quote { border-left: 2px solid var(--border); padding-left: 11px; font-style: italic; color: #4a4e56; }
.decisions { margin: 0; padding-left: 17px; font-size: 13px; line-height: 1.6; color: #3f434b; }
.decisions li { padding-bottom: 4px; }
.file-row { display: flex; align-items: center; gap: 7px; font: 500 12px/1 ui-monospace, Menlo, monospace; color: #4a4e56; padding: 6px 0; }

.ask-box { background: var(--warning-bg); border: 1px solid #e8d5ad; border-radius: 10px; padding: 12px 14px; }
.ask-k { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--warning-fg); }
.ask-q { font-size: 13.5px; line-height: 1.55; padding-top: 7px; color: #4a4028; }

/* ---------- command palette ---------- */
.pal-scrim {
  position: fixed; inset: 0; background: rgba(23,39,66,.32); z-index: 60;
  display: none; align-items: flex-start; justify-content: center; padding-top: 11vh;
}
.pal-scrim.open { display: flex; }
.pal {
  width: min(660px, 94vw); background: #fff; border-radius: 14px; overflow: hidden;
  box-shadow: 0 26px 64px -14px rgba(16,24,40,.42), 0 0 0 1px rgba(16,24,40,.06);
  display: flex; flex-direction: column; max-height: 74vh;
}
.pal-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex: none; }
.pal-input input { border: 0; outline: 0; font: inherit; font-size: 15px; flex: 1; color: var(--foreground); background: transparent; }
.pal-scope { display: flex; align-items: center; gap: 8px; padding: 7px 16px; background: #fbfbfc; border-bottom: 1px solid var(--border); font-size: 11.5px; color: #62666e; flex: none; }
.pal-scope b { color: #45484f; font-weight: 600; }
.pal-body { overflow-y: auto; padding: 6px; flex: 1; }
.pal-group { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted-foreground); padding: 9px 10px 5px; display: flex; gap: 7px; align-items: baseline; }
.pal-group span { font-weight: 500; text-transform: none; letter-spacing: 0; color: #b0b3b9; }
.pal-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.pal-row:hover { background: #f5f6f8; }
.pal-row[aria-selected="true"] { background: var(--info-bg); }
.pal-main { min-width: 0; flex: 1; }
.pal-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-sub { font-size: 11.5px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 2px; display: flex; align-items: center; }
.pal-right { font-size: 11px; color: var(--muted-foreground); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.pal-foot { display: flex; align-items: center; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--border); background: #fbfbfc; font-size: 11px; color: var(--muted-foreground); flex: none; flex-wrap: wrap; }
.pal-empty { padding: 26px 16px; text-align: center; color: var(--muted-foreground); font-size: 13px; line-height: 1.6; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(14px);
  background: #23262d; color: #fff; font-size: 12.5px; padding: 10px 15px; border-radius: 9px;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 80;
  box-shadow: 0 12px 30px -12px rgba(0,0,0,.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }


body { background: #eef1f7; color: #1e2128; }
.aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); }
.b1 { width: 620px; height: 620px; left: -170px; top: -220px; background: radial-gradient(circle, #b9c6f5 0%, transparent 68%); opacity: .75; }
.b2 { width: 560px; height: 560px; right: -150px; top: -130px; background: radial-gradient(circle, #a9dbe4 0%, transparent 68%); opacity: .6; }
.b3 { width: 720px; height: 520px; left: 32%; bottom: -320px; background: radial-gradient(circle, #dcc4ea 0%, transparent 70%); opacity: .5; }
@media (prefers-reduced-motion: no-preference) {
  .b1 { animation: d1 30s ease-in-out infinite; } .b2 { animation: d2 35s ease-in-out infinite; } .b3 { animation: d3 41s ease-in-out infinite; }
}
@keyframes d1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(60px,50px) } }
@keyframes d2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-50px,70px) } }
@keyframes d3 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-70px,-40px) } }

.shell { position: relative; z-index: 2; display: flex; height: calc(100vh - 33px); }
.rail { width: 218px; flex: none; padding: 18px 13px; border-right: 1px solid rgba(20,28,50,.09);
        background: rgba(255,255,255,.62); backdrop-filter: blur(22px) saturate(140%);
        -webkit-backdrop-filter: blur(22px) saturate(140%); overflow-y: auto; }
.rail .logo { padding: 0 5px 20px; }
.rail-label { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #8a8f99; padding: 0 8px 8px; }
.rail-group { padding-bottom: 16px; }
.rail-item { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 9px; font-size: 13px;
             color: #5f636c; cursor: pointer; border: 1px solid transparent; width: 100%; background: none; text-align: left; }
.rail-item:hover { background: rgba(255,255,255,.9); color: #1e2128; }
.rail-item[aria-current="true"] { background: rgba(53,84,209,.09); border-color: rgba(53,84,209,.24); color: var(--brand); font-weight: 600; }
.rail-n { margin-left: auto; font: 600 11px/1 ui-monospace, Menlo, monospace; color: #8a8f99; }
.rail-item[aria-current="true"] .rail-n { color: var(--brand); }
.rdot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
.rdot-hollow { width: 7px; height: 7px; border-radius: 999px; border: 1.5px dashed #b6b9bf; flex: none; }
.spend-card { padding: 12px; border-radius: 12px; background: rgba(255,255,255,.72); border: 1px solid rgba(20,28,50,.09); }
.spend-k { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #8a8f99; }
.spend-v { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; padding-top: 4px; font-variant-numeric: tabular-nums; }
.spend-s { font-size: 11px; color: #8a8f99; padding-top: 3px; }
.bar { display: flex; height: 4px; border-radius: 999px; overflow: hidden; margin-top: 10px; gap: 2px; }
.bar i { display: block; height: 100%; border-radius: 999px; }

.main { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 24px 60px; }
.mtop { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; }
.mtop .search-wrap { max-width: 520px; }
.mtop .search-wrap input { background: rgba(255,255,255,.82); border-color: rgba(20,28,50,.09); height: 38px; }
.mtop .search-wrap input:focus { background: #fff; }

.hero { border-radius: 17px; padding: 17px 20px; margin-bottom: 8px; background: rgba(255,255,255,.78);
        border: 1px solid rgba(20,28,50,.09); backdrop-filter: blur(24px) saturate(140%);
        -webkit-backdrop-filter: blur(24px) saturate(140%); box-shadow: 0 12px 32px -22px rgba(20,28,50,.35); }
.hero-calm { display: flex; align-items: center; gap: 12px; }
.hero-icon { width: 33px; height: 33px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--success-bg); color: var(--success-fg); }
.hero-t { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
.hero-s { font-size: 12.5px; color: #5f636c; padding-top: 2px; }
.hero-wait { background: linear-gradient(115deg, rgba(224,164,74,.16), rgba(255,255,255,.74) 55%); border-color: rgba(192,138,46,.34); }
.hero-k { display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--warning-fg); }
.hero-title { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; padding-top: 8px; }
.hero-q { font-size: 13.5px; color: #5f636c; padding-top: 7px; max-width: 70ch; line-height: 1.55; }
.hero-row { display: flex; align-items: center; gap: 9px; padding-top: 14px; flex-wrap: wrap; }
.gchip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: #5f636c;
         background: rgba(255,255,255,.8); border: 1px solid rgba(20,28,50,.09); border-radius: 8px; padding: 5px 9px; }

.sec { display: flex; align-items: center; gap: 10px; padding: 20px 2px 10px; }
.sec-t { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #5f636c; }
.sec-n { font: 600 11px/1 ui-monospace, Menlo, monospace; color: #8a8f99; background: rgba(255,255,255,.8);
         border: 1px solid rgba(20,28,50,.09); border-radius: 999px; padding: 4px 8px; }
.sec-rule { flex: 1; height: 1px; background: rgba(20,28,50,.09); }
.sec-s { font-size: 11.5px; color: #8a8f99; font-variant-numeric: tabular-nums; }

.livegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 13px; }
.live { position: relative; border-radius: 15px; padding: 15px 17px; overflow: hidden; cursor: pointer; text-align: left;
        background: rgba(255,255,255,.86); border: 1px solid rgba(20,28,50,.15);
        backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
        box-shadow: 0 10px 28px -20px rgba(20,28,50,.45); transition: transform .2s cubic-bezier(.2,.7,.3,1), border-color .2s; width: 100%; }
.live:hover { transform: translateY(-2px); border-color: rgba(53,84,209,.3); }
.live::after { content: ''; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
               background: linear-gradient(90deg, transparent, var(--success), transparent); }
@media (prefers-reduced-motion: no-preference) { .live::after { animation: sweep 2.8s linear infinite; } }
@media (prefers-reduced-motion: reduce) { .live::after { background: var(--success); opacity: .5; } }
@keyframes sweep { 0% { transform: translateX(-100%) } 100% { transform: translateX(100%) } }
.live-top { display: flex; align-items: center; gap: 8px; }
.live-title { font-size: 15px; font-weight: 650; letter-spacing: -0.015em; padding-top: 10px; line-height: 1.3; }
.live-where { display: flex; align-items: center; gap: 7px; padding-top: 8px; flex-wrap: wrap; font-size: 12px; color: #5f636c; }

const SEARCH_FIELDS = [
  { key: 'title',    label: 'title'    },
  { key: 'goal',     label: 'goal'     },
  { key: 'outcome',  label: 'outcome'  },
  { key: 'repo',     label: 'repo'     },
  { key: 'branch',   label: 'branch'   },
  { key: 'artifact', label: 'file'     },
];

/** Rank: title > goal/outcome > repo/branch/file. Recency breaks ties.
    Live sessions do NOT jump the queue once a query exists. */
function searchSessions(query) {
  const q = query.trim().toLowerCase();
  if (!q) return SESSIONS.map((s) => ({ session: s, evidence: null, score: 0 }));

  const hits = [];
  for (const s of SESSIONS) {
    let best = null;
    let score = 0;
    const test = (field, value, weight) => {
      if (!value) return;
      const i = value.toLowerCase().indexOf(q);
      if (i === -1) return;
      if (weight > score) { score = weight; best = { field, value, index: i }; }
    };
    test('title', s.title, 100);
    test('outcome', s.outcome, 60);
    test('goal', s.goal, 55);
    test('repo', s.repo, 30);
    test('branch', s.branch, 28);
    for (const a of s.artifacts || []) test('file', a, 25);
    if (best) hits.push({ session: s, evidence: best, score });
  }
  hits.sort((a, b) => b.score - a.score || a.session.rank - b.session.rank);
  return hits;
}

function snippet(value, index, q, pad = 46) {
  const start = Math.max(0, index - pad);
  const end = Math.min(value.length, index + q.length + pad);
  return (start > 0 ? '…' : '') + value.slice(start, end) + (end < value.length ? '…' : '');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, i)) + '<mark>' + escapeHtml(text.slice(i, i + q.length)) + '</mark>' + escapeHtml(text.slice(i + q.length));
}

function money(n) { return '$' + n.toFixed(2); }

function statusOf(s) { return STATUS[s.status]; }
function agentOf(s) { return AGENT[s.agent]; }

/** Attention buckets used by the list groups and the board lanes. */
function bucketOf(s) {
  if (s.status === 'waiting') return 'needs';
  if (s.status === 'busy') return 'running';
  if (s.status === 'idle') return 'idle';
  if (s.status === 'unknown') return 'unknown';
  return /ago|now/.test(s.when) && !/\d+d ago|yesterday/.test(s.when) ? 'today' : 'earlier';
}

const BUCKETS = [
  { key: 'needs',   label: 'Needs you',        empty: 'Nothing is waiting on you.' },
  { key: 'running', label: 'Running',          empty: 'No sessions running.' },
  { key: 'idle',    label: 'Idle',             empty: 'No idle sessions.' },
  { key: 'today',   label: 'Last active today',empty: 'Nothing active today.' },
  { key: 'unknown', label: 'Liveness unknown', empty: 'No unknown sessions.' },
  { key: 'earlier', label: 'Earlier',          empty: 'Nothing earlier.' },
];

/* Derived from SESSIONS so every surface agrees. The live dataset held 52 sessions;
   this sample carries 22 of them, so counts shown are the sample's own. */
const TOTALS = {
  sessions: SESSIONS.length,
  claude: SESSIONS.filter((s) => s.agent === 'claude').length,
  codex: SESSIONS.filter((s) => s.agent === 'codex').length,
  spend: SESSIONS.reduce((n, s) => n + s.cost, 0),
  active: SESSIONS.filter((s) => s.status === 'busy').length,
  inactive: SESSIONS.filter((s) => s.status === 'inactive').length,
  unknown: SESSIONS.filter((s) => s.status === 'unknown').length,
  waiting: SESSIONS.filter((s) => s.status === 'waiting').length,
  tokens: '68M',
};

</script>
<script>
/* coSlash prototype — shared behaviour: inspector drawer, ⌘K palette, toasts.
   Prototype only: Resume and Copy handoff are simulated. */

/* ---------- toast ---------- */
function toast(message) {
  let el = document.querySelector('.toast');
  if (!el) {
    el = document.createElement('div');
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------- inspector drawer ---------- */
function mountDrawer() {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  const drawer = document.createElement('div');
  drawer.className = 'drawer';
  drawer.setAttribute('role', 'dialog');
  drawer.setAttribute('aria-label', 'Session inspector');
  document.body.append(scrim, drawer);
  scrim.addEventListener('click', closeDrawer);
  return { scrim, drawer };
}

let _drawer = null;
function closeDrawer() {
  if (!_drawer) return;
  _drawer.drawer.classList.remove('open');
  _drawer.scrim.classList.remove('open');
}

function stateMarkup(s) {
  const st = statusOf(s);
  const cls = { active: 'state-active', waiting: 'state-waiting', idle: 'state-idle', off: 'state-off', unknown: 'state-unknown' }[st.tone];
  const pip = { active: 'pip-active', waiting: 'pip-waiting', idle: 'pip-idle', off: 'pip-off', unknown: 'pip-unknown' }[st.tone];
  return `<span class="state ${cls}"><span class="pip ${pip}"></span>${st.label}</span>`;
}

function agentMarkup(s) {
  const a = agentOf(s);
  return `<span class="agent-tag agent-${a.key}"><span class="agent-swatch"></span>${a.label}</span>`;
}

function openSession(id) {
  const s = SESSIONS.find((x) => x.id === id);
  if (!s) return;
  if (!_drawer) _drawer = mountDrawer();
  const { scrim, drawer } = _drawer;

  const canResume = s.status !== 'unknown' && !(s.status === 'busy' && s.agent === 'codex');
  const resumeHint = s.status === 'unknown'
    ? 'Host unreachable — resume unavailable'
    : (s.status === 'busy' && s.agent === 'codex')
      ? 'This session is already active'
      : `Reopens in ${agentOf(s).label} · ${s.source === 'local' ? 'This Mac' : s.source}`;

  drawer.innerHTML = `
    <div class="drawer-head">
      <div class="drawer-title-row">
        ${agentMarkup(s)}
        <span class="drawer-title">${escapeHtml(s.title)}</span>
        <button class="drawer-close" aria-label="Close">✕</button>
      </div>
      <div class="drawer-sub">
        ${stateMarkup(s)}
        <span>${escapeHtml(s.repo)}</span>
        ${s.branch ? `<span class="chip-mono">${escapeHtml(s.branch)}</span>` : ''}
        ${s.source !== 'local' ? `<span class="chip-remote">${escapeHtml(s.source)}</span>` : ''}
        <span>${escapeHtml(s.when)}</span>
        ${s.illustrative ? '<span class="tag-illustrative">illustrative</span>' : ''}
      </div>
    </div>
    <div class="drawer-body">
      <div class="stat-grid">
        <div class="stat-cell"><div class="stat-k">Est. cost</div><div class="stat-v">${money(s.cost)}</div></div>
        <div class="stat-cell"><div class="stat-k">Tokens</div><div class="stat-v">${s.tokens}</div></div>
        <div class="stat-cell"><div class="stat-k">Duration</div><div class="stat-v">${s.duration ?? '—'}</div></div>
        <div class="stat-cell"><div class="stat-k">Turns</div><div class="stat-v">${s.turns}</div></div>
        <div class="stat-cell"><div class="stat-k">Context</div><div class="stat-v">${s.ctx}%</div></div>
        <div class="stat-cell"><div class="stat-k">Files</div><div class="stat-v">${s.files}</div></div>
      </div>

      ${s.question ? `
        <div class="sec-k">Waiting on you</div>
        <div class="ask-box">
          <div class="ask-k">Question</div>
          <div class="ask-q">“${escapeHtml(s.question)}”</div>
        </div>` : ''}

      ${s.status === 'unknown' ? `
        <div class="sec-k">Liveness</div>
        <div class="empty-note">
          <span>Process state could not be read from <b>${escapeHtml(s.source)}</b>. This session is
          <b>not finished</b> — it may still be running.</span>
        </div>` : ''}

      <div class="sec-k">Goal</div>
      <div class="prose prose-quote">${escapeHtml(s.goal)}</div>

      <div class="sec-k">Outcome</div>
      <div class="prose">${escapeHtml(s.outcome)}</div>

      ${s.decisions && s.decisions.length ? `
        <div class="sec-k">Key decisions</div>
        <ul class="decisions">${s.decisions.map((d) => `<li>${escapeHtml(d)}</li>`).join('')}</ul>` : ''}

      ${s.artifacts && s.artifacts.length ? `
        <div class="sec-k">Files touched</div>
        ${s.artifacts.map((a) => `<div class="file-row">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9aa0a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
          ${escapeHtml(a)}</div>`).join('')}` : ''}

      ${s.subagents ? `
        <div class="sec-k">Subagents</div>
        <div class="empty-note"><span><b>${s.subagents} subagents</b> ran in their own context windows and returned one result each.</span></div>` : ''}

      <div class="sec-k">Session</div>
      <div class="file-row" style="color:#8e8e8e">${escapeHtml(s.id)}</div>
    </div>
    <div class="drawer-foot">
      <button class="btn">Copy handoff</button>
      <button class="btn btn-primary" ${canResume ? '' : 'disabled'}>Resume</button>
      <span class="hint">${escapeHtml(resumeHint)}</span>
    </div>`;

  drawer.querySelector('.drawer-close').addEventListener('click', closeDrawer);
  drawer.querySelector('.btn').addEventListener('click', () => toast('Handoff brief copied (simulated)'));
  const resume = drawer.querySelector('.btn-primary');
  if (canResume) resume.addEventListener('click', () => toast(`Resuming in ${agentOf(s).label} (simulated)`));

  drawer.classList.add('open');
  scrim.classList.add('open');
}

/* ---------- command palette ---------- */
let _pal = null;
let _palIndex = 0;
let _palRows = [];

function mountPalette() {
  const scrim = document.createElement('div');
  scrim.className = 'pal-scrim';
  scrim.innerHTML = `
    <div class="pal" role="dialog" aria-label="Find a session">
      <div class="pal-input">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input placeholder="Search title, goal, outcome, repo, branch, filename" />
      </div>
      <div class="pal-scope"></div>
      <div class="pal-body"></div>
      <div class="pal-foot">
        <span><span class="kbd">↑↓</span> move</span>
        <span><span class="kbd">↵</span> open</span>
        <span><span class="kbd">esc</span> close</span>
        <span style="margin-left:auto" class="pal-target"></span>
      </div>
    </div>`;
  document.body.appendChild(scrim);
  scrim.addEventListener('click', (e) => { if (e.target === scrim) closePalette(); });
  const input = scrim.querySelector('input');
  input.addEventListener('input', () => { _palIndex = 0; renderPalette(input.value); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); _palIndex = Math.min(_palIndex + 1, _palRows.length - 1); renderPalette(input.value, true); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); _palIndex = Math.max(_palIndex - 1, 0); renderPalette(input.value, true); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const row = _palRows[_palIndex];
      if (row) { closePalette(); openSession(row.id); }
    } else if (e.key === 'Escape') { closePalette(); }
  });
  return scrim;
}

function openPalette() {
  if (!_pal) _pal = mountPalette();
  _pal.classList.add('open');
  const input = _pal.querySelector('input');
  input.value = '';
  _palIndex = 0;
  renderPalette('');
  input.focus();
}
function closePalette() { if (_pal) _pal.classList.remove('open'); }

function renderPalette(query, keepScroll) {
  const body = _pal.querySelector('.pal-body');
  const scope = _pal.querySelector('.pal-scope');
  const target = _pal.querySelector('.pal-target');
  const q = query.trim();
  const prevScroll = body.scrollTop;

  if (!q) {
    // Empty query: shortcuts are appropriate. Live sessions surface here, not in ranked results.
    const live = SESSIONS.filter((s) => s.status === 'busy' || s.status === 'waiting');
    const recent = SESSIONS.filter((s) => s.status !== 'busy' && s.status !== 'waiting').slice(0, 4);
    _palRows = [...live, ...recent];
    scope.innerHTML = `Searching <b>all time</b> · ${TOTALS.sessions} sessions · <b>${TOTALS.waiting} waiting</b>, ${TOTALS.active} running`;
    body.innerHTML =
      `<div class="pal-group">Live now <span>· ${live.length}</span></div>` +
      live.map((s, i) => palRow(s, null, q, i)).join('') +
      `<div class="pal-group">Recently active</div>` +
      recent.map((s, i) => palRow(s, null, q, live.length + i)).join('');
  } else {
    const hits = searchSessions(q);
    _palRows = hits.map((h) => h.session);
    const pending = 3;
    scope.innerHTML = `Searching <b>all time</b> · <b>${hits.length} ${hits.length === 1 ? 'match' : 'matches'}</b> of ${TOTALS.sessions} sessions`;
    if (!hits.length) {
      body.innerHTML = `<div class="pal-empty">
        No session matches “${escapeHtml(q)}” in title, goal, outcome, repo, branch or filename.<br>
        <span style="font-size:11.5px">${pending} sessions have no synthesis yet and cannot be matched on goal or outcome.</span>
      </div>`;
    } else {
      body.innerHTML =
        `<div class="pal-group">Matches <span>· ranked by where the text was found; recency breaks ties</span></div>` +
        hits.map((h, i) => palRow(h.session, h.evidence, q, i)).join('') +
        `<div class="pal-group">Not searched <span>· ${pending} sessions have no synthesis yet</span></div>`;
    }
  }

  const sel = _palRows[_palIndex];
  target.innerHTML = sel
    ? `<span class="kbd">↵</span> opens in <b style="color:#45484f">${agentOf(sel).label} · ${sel.source === 'local' ? 'This Mac' : sel.source}</b>`
    : '';

  body.querySelectorAll('.pal-row').forEach((row, i) => {
    row.addEventListener('click', () => { closePalette(); openSession(row.dataset.id); });
    row.addEventListener('mousemove', () => { if (_palIndex !== i) { _palIndex = i; renderPalette(query, true); } });
  });
  if (keepScroll) body.scrollTop = prevScroll;
  const active = body.querySelector('[aria-selected="true"]');
  if (active && !keepScroll) active.scrollIntoView({ block: 'nearest' });
}

function palRow(s, evidence, q, index) {
  const sel = index === _palIndex;
  let sub;
  if (evidence && evidence.field !== 'title') {
    const text = snippet(evidence.value, evidence.index, q);
    const extra = evidence.field === 'repo' && /^[a-z-]+-https?-/.test(s.repo)
      ? ' <span style="color:#b0b3b9">· generated folder name</span>' : '';
    sub = `<span class="why">${evidence.field}</span>${highlight(text, q)}${extra}`;
  } else {
    sub = `${escapeHtml(s.repo)}${s.branch ? ' · ' + escapeHtml(s.branch) : ''} · ${escapeHtml(s.when)}`;
  }
  const title = evidence && evidence.field === 'title' ? highlight(s.title, q) : escapeHtml(s.title);
  return `<div class="pal-row" role="option" aria-selected="${sel}" data-id="${s.id}">
    <span class="agent-tag agent-${s.agent}" style="font-size:10px"><span class="agent-swatch"></span>${agentOf(s).label}</span>
    <div class="pal-main">
      <div class="pal-title">${title}</div>
      <div class="pal-sub">${sub}</div>
    </div>
    <div class="pal-right">${money(s.cost)}<br><span style="font-size:10px">${escapeHtml(s.when)}</span></div>
  </div>`;
}

/* ---------- global keys ---------- */
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') { closePalette(); closeDrawer(); }
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    const box = document.querySelector('.search-wrap input');
    if (box) box.focus(); else openPalette();
  }
});

</script>
<script>

const qBox = document.getElementById('q');
const content = document.getElementById('content');
let filter = { kind: 'attention', value: 'all' };
let query = '';

const ATTN = [
  { v: 'all',     label: 'Everything',       dot: '#9aa0a8' },
  { v: 'needs',   label: 'Needs you',        dot: '#ddd0b0' },
  { v: 'running', label: 'Running',          dot: 'var(--success)' },
  { v: 'idle',    label: 'Idle',             dot: 'var(--info)' },
  { v: 'today',   label: 'Last active today',dot: '#c3c6cc' },
  { v: 'unknown', label: 'Liveness unknown', hollow: true },
];

function renderNav() {
  document.getElementById('attnNav').innerHTML = ATTN.map((a) => {
    const n = a.v === 'all' ? SESSIONS.length : SESSIONS.filter((s) => bucketOf(s) === a.v).length;
    const on = filter.kind === 'attention' && filter.value === a.v;
    return `<button class="rail-item" data-kind="attention" data-v="${a.v}" aria-current="${on}">
      ${a.hollow ? '<span class="rdot-hollow"></span>' : `<span class="rdot" style="background:${a.dot}"></span>`}
      ${a.label}<span class="rail-n">${n}</span></button>`;
  }).join('');
  document.getElementById('agentNav').innerHTML = Object.values(AGENT).map((a) => {
    const n = SESSIONS.filter((s) => s.agent === a.key).length;
    const on = filter.kind === 'agent' && filter.value === a.key;
    return `<button class="rail-item" data-kind="agent" data-v="${a.key}" aria-current="${on}">
      <span class="rdot" style="background:var(--${a.key})"></span>${a.label}<span class="rail-n">${n}</span></button>`;
  }).join('');
  document.querySelectorAll('.rail-item').forEach((b) => b.addEventListener('click', () => {
    filter = { kind: b.dataset.kind, value: b.dataset.v };
    render();
  }));
}

qBox.addEventListener('input', () => { query = qBox.value; render(); });

function visible() {
  let hits = searchSessions(query);
  if (filter.kind === 'agent') hits = hits.filter((h) => h.session.agent === filter.value);
  else if (filter.value !== 'all') hits = hits.filter((h) => bucketOf(h.session) === filter.value);
  return hits;
}

function liveCard(s) {
  return `<button class="live" data-id="${s.id}">
    <div class="live-top">${agentMarkup(s)}${stateMarkup(s)}</div>
    <div class="live-title">${escapeHtml(s.title)}</div>
    <div class="live-where"><span>${escapeHtml(s.repo)}</span>${s.branch ? `<span class="chip-mono">${escapeHtml(s.branch)}</span>` : ''}</div>
    <div class="live-doing">${escapeHtml(s.doing || s.goal)} — ${s.turns} turns, ${s.tools} tool calls</div>
    <div class="live-foot">
      <span class="lstat"><b>${money(s.cost)}</b></span>
      <span class="lstat">${s.tokens} tok</span>
      <span class="lstat">${s.duration ?? '—'}</span>
      <span class="gauge" title="Measured context usage — not a prediction of when compaction will occur">
        <span class="gtrack"><span class="gfill" style="width:${s.ctx}%"></span></span><span class="gt">${s.ctx}% ctx</span>
      </span>
    </div>
  </button>`;
}

function srow(h) {
  const s = h.session;
  let sum = '';
  const q = query.trim();
  if (h.evidence && h.evidence.field !== 'title') {
    sum = `<div class="s-sum"><span class="why">${h.evidence.field}</span>${highlight(snippet(h.evidence.value, h.evidence.index, q), q)}</div>`;
  } else if (s.outcome) sum = `<div class="s-sum">${escapeHtml(s.outcome)}</div>`;
  const title = h.evidence && h.evidence.field === 'title' ? highlight(s.title, q) : escapeHtml(s.title);
  return `<button class="srow${s.status === 'unknown' ? ' srow-unknown' : ''}" data-id="${s.id}">
    <div class="s1">${agentMarkup(s)}<span class="s-title">${title}</span><span class="s-when">${escapeHtml(s.when)}</span></div>
    <div class="s2">
      ${s.status !== 'inactive' ? stateMarkup(s) : ''}
      ${s.source !== 'local' ? `<span class="chip-remote">${escapeHtml(s.source)}</span>` : ''}
      <span class="s-path">${escapeHtml(s.repo)}${s.branch ? ' · ' + escapeHtml(s.branch) : ''}${s.duration ? ' · ' + s.duration : ''}</span>
      ${s.subagents ? `<span class="chip-subs">${s.subagents} subagents</span>` : ''}
      <span class="s-spend"><b>${money(s.cost)}</b> · ${s.tokens}</span>
    </div>${sum}</button>`;
}

function renderSpend() {
  document.getElementById('spendV').textContent = money(TOTALS.spend);
  document.getElementById('spendS').textContent = `${TOTALS.sessions} sessions · ${TOTALS.tokens} tokens`;
  const codexPct = Math.round((TOTALS.codex / TOTALS.sessions) * 100);
  document.getElementById('spendBar').innerHTML =
    `<i style="width:${codexPct}%;background:var(--codex)"></i><i style="width:${100 - codexPct}%;background:var(--claude)"></i>`;
}

function render() {
  renderNav();
  renderSpend();
  const hits = visible();
  const q = query.trim();

  if (!hits.length) {
    content.innerHTML = `<div class="no-results"><b>Nothing matches “${escapeHtml(q)}”</b>
      Searched title, goal, outcome, repo, branch and filenames across all time.</div>`;
    return;
  }

  const waiting = hits.filter((h) => h.session.status === 'waiting').map((h) => h.session);
  const live = hits.filter((h) => h.session.status === 'busy').map((h) => h.session);
  const rest = hits.filter((h) => !['waiting', 'busy'].includes(h.session.status));

  let html = '';

  if (!q) {
    if (waiting.length) {
      const s = waiting[0];
      html += `<div class="hero hero-wait">
        <div class="hero-k">${waiting.length === 1 ? 'One session is' : waiting.length + ' sessions are'} waiting on you</div>
        <div class="hero-title">${escapeHtml(s.title)}</div>
        ${s.question ? `<div class="hero-q">“${escapeHtml(s.question)}”</div>` : ''}
        <div class="hero-row">
          <span class="gchip">${escapeHtml(s.repo)}</span>
          ${s.branch ? `<span class="gchip" style="font-family:ui-monospace,Menlo,monospace">${escapeHtml(s.branch)}</span>` : ''}
          <span class="gchip">blocked ${escapeHtml(s.when)}</span>
          <span class="gchip">${s.duration} · ${s.files} files · ${money(s.cost)}</span>
          <button class="btn" style="margin-left:auto" data-open="${s.id}">Open in inspector</button>
          <button class="btn btn-primary" data-resume="${s.id}">Open in ${agentOf(s).label}</button>
        </div>
      </div>`;
    } else {
      html += `<div class="hero"><div class="hero-calm">
        <span class="hero-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        <div><div class="hero-t">Nothing is waiting on you</div>
        <div class="hero-s">${live.length} running · ${SESSIONS.filter((s) => s.status === 'unknown').length} with unknown liveness · last check just now</div></div>
        <button class="btn" style="margin-left:auto" data-filter="unknown">Review unknown</button>
      </div></div>`;
    }
  }

  if (live.length) {
    html += `<div class="sec"><span class="sec-t">Running now</span><span class="sec-n">${live.length}</span>
      <span class="sec-rule"></span><span class="sec-s">${money(live.reduce((n, s) => n + s.cost, 0))} so far</span></div>
      <div class="livegrid">${live.map(liveCard).join('')}</div>`;
  }

  if (rest.length) {
    const unknown = rest.filter((h) => h.session.status === 'unknown');
    const others = rest.filter((h) => h.session.status !== 'unknown');
    if (others.length) {
      html += `<div class="sec"><span class="sec-t">${q ? 'Matches' : 'Earlier'}</span><span class="sec-n">${others.length}</span><span class="sec-rule"></span></div>
        <div class="stream">${others.map(srow).join('')}</div>`;
    }
    if (unknown.length) {
      html += `<div class="sec"><span class="sec-t">Liveness unknown</span><span class="sec-n">${unknown.length}</span><span class="sec-rule"></span></div>
        <div class="band"><b>${unknown.length} sessions.</b> Transcript activity is readable but process state could not be
        determined — typically a remote host that is unreachable. These are <b>not finished</b> and may still be running.</div>
        <div class="stream">${unknown.map(srow).join('')}</div>`;
    }
  }

  content.innerHTML = html;
  content.querySelectorAll('[data-id]').forEach((el) => el.addEventListener('click', () => openSession(el.dataset.id)));
  content.querySelectorAll('[data-open]').forEach((el) => el.addEventListener('click', (e) => { e.stopPropagation(); openSession(el.dataset.open); }));
  content.querySelectorAll('[data-resume]').forEach((el) => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const s = SESSIONS.find((x) => x.id === el.dataset.resume);
    toast(`Opening in ${agentOf(s).label} (simulated)`);
  }));
  const rev = content.querySelector('[data-filter]');
  if (rev) rev.addEventListener('click', () => { filter = { kind: 'attention', value: 'unknown' }; render(); });
}

render();

</script>
</body>
</html>
